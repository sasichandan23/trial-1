[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memolint"
version = "0.1.0"
description = "A code reviewer that remembers your team's precedents. Built on Hindsight agent memory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Aaditya Singh" },
  { name = "Sasi Chandan" },
]
keywords = ["code-review", "agent-memory", "mcp", "hindsight", "ai-agents", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "hindsight-client>=0.10",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "rich>=13",
  "typer>=0.12",
  "requests>=2.31",
  "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/WaifuPuller/MemoLint"
Repository = "https://github.com/WaifuPuller/MemoLint"
Issues = "https://github.com/WaifuPuller/MemoLint/issues"

[project.scripts]
memolint = "memolint.cli:app"
memolint-mcp = "memolint.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
