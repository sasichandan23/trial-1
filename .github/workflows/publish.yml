name: publish

# Publishes to PyPI when a version tag is pushed:
#   git tag v0.1.0 && git push --tags
#
# Uses PyPI Trusted Publishing, so no token is stored in this repository.
# One-time setup on pypi.org, under the project's Publishing settings:
#   owner: WaifuPuller   repository: MemoLint   workflow: publish.yml   environment: pypi
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build --wheel --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
